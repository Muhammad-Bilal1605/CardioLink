name: expansetracker
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  icons_plus: ^4.0.0
  camera: ^0.10.5+9
  flutter_webrtc: ^0.12.4
  sdp_transform: ^0.3.2
  uuid: ^4.4.2
