name: expansetracker
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  icons_plus: ^4.0.0
  camera: ^0.10.5+9
  flutter_webrtc: ^0.10.8
  sdp_transform: ^0.3.2
  uuid: ^4.4.2
  permission_handler: ^11.4.0  # Downgraded as suggested by Flutter
  package_info_plus: 4.2.0
  
 
  
  #location
  location: ^5.0.0
  
  # State Management
  provider: ^6.1.2

  # Environment variables
  flutter_dotenv: ^5.1.0

  # Networking & Backend Integration
  http: ^1.2.2
  url_launcher: ^6.3.0
  web_socket_channel: ^2.4.5
  socket_io_client: ^2.0.3+1
  flutter_native_splash: ^2.3.10

  
  
  
  
  google_maps_flutter: ^2.5.0

  # Local Storage
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4

  # Utilities
  intl: ^0.19.0
  image_picker: ^1.1.2
  open_file: ^3.3.2
  file_picker: 6.1.1
  geocoding: ^2.1.1
  syncfusion_flutter_charts: ^26.2.14
  
  # ZegoCloud Video Calling
  #zego_uikit_prebuilt_call: ^4.9.0
  #zego_uikit_signaling_plugin: ^2.8.2
  #json_annotation: ^4.8.1
  agora_rtc_engine: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

# Override problematic transitive dependencies
dependency_overrides:
 # flutter_vibrate: ^1.3.0
    