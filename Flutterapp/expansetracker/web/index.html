<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CardioLink - Connect with your doctor">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CardioLink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CardioLink</title>
  <link rel="manifest" href="manifest.json">

  <!-- WebRTC Adapter -->
  <script src="https://unpkg.com/webrtc-adapter@8.2.2/adapter.min.js"></script>
  <script src="https://unpkg.com/flutter-webrtc/flutter_webrtc.js"></script>
  <script src="https://unpkg.com/flutter-webrtc/flutter_webrtc.js"></script>
  <script src="https://unpkg.com/webrtc-adapter"></script>
</head>
<body>
  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = document.createEvent('Event');
    scriptLoaded.initEvent('flutter-service-worker', true, true);
    window.addEventListener('flutter-first-frame', function() {
      document.dispatchEvent(scriptLoaded);
    });

    // Enable WebRTC logging
    if (window.flutterWebRTC) {
      window.flutterWebRTC.setLogLevel('debug');
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
