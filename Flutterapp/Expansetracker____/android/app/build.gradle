plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.expansetracker"
    compileSdk = 35  // Fixed: Remove duplicate and use static value
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"  // Fixed: Use string instead of JavaVersion
    }

    defaultConfig {
        applicationId = "com.example.expansetracker"
        minSdk = 21  // Fixed: Use static value instead of flutter.minSdkVersion
        targetSdk = 35  // Fixed: Use static value
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}